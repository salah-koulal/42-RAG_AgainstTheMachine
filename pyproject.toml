[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation over a codebase, built for the 42 RAG against the machine project."
requires-python = ">=3.10"
dependencies = [
    "fire>=0.7.1",
    "huggingface-hub>=1.29.0",
    "pydantic>=2.13.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.7.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.16.1",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["data/"]
