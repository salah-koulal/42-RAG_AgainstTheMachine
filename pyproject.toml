[project]
name = "rag-against-the-machine"
version = "0.1.0"
description = "Retrieval-Augmented Generation over a codebase, built for the 42 RAG against the machine project."
requires-python = ">=3.10"
dependencies = [
    "bm25s>=0.3.14",
    "fastapi>=0.162.0",
    "fire>=0.7.1",
    "flake8>=7.3.0",
    "huggingface-hub>=1.29.0",
    "langchain-text-splitters>=1.1.3",
    "pydantic>=2.13.4",
    "rich>=15.0.0",
    "scikit-learn>=1.7.2",
    "torch>=2.13.0",
    "tqdm>=4.70.0",
    "transformers>=5.16.1",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
]

[tool.mypy]
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true
check_untyped_defs = true
exclude = ["data/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]


[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
